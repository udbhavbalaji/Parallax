[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-impact-explorer"
version = "0.2.0"
description = "Offline, evidence-backed C, Python, TypeScript, and Go call graph explorer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Code Impact Explorer contributors"}]
dependencies = []

[project.scripts]
cie = "cie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cie*"]

[tool.setuptools.package-data]
cie = ["ts_ast.cjs", "go_ast.go"]
